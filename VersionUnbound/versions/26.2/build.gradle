plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'java'

	group = rootProject.group
	version = rootProject.version

	repositories {
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = 'UTF-8'
	}
}

// Testmods are compiled the way NeoForge's toolchain compiles mods: NeoForge's extension interfaces appear on vanilla
// classes, so a call like registry.addAlias(...) compiles to the same bytecode as in a real mod. Loom applies a class
// tweaker for that, which this task generates from the injected-interfaces.json in NeoForge's jar. Loom reads the file
// while configuring the testmods, so the output is checked in; run this task again after changing neoforge_version.
configurations {
	neoforgeUniversal {
		transitive = false
	}
}
repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases/'
	}
}
dependencies {
	neoforgeUniversal "net.neoforged:neoforge:${neoforge_version}:universal"
}
tasks.register('generateTestmodClassTweaker') {
	def neoforgeJar = configurations.neoforgeUniversal
	def output = file('testmods/neoforge-compile.classtweaker')
	def version = neoforge_version
	inputs.files neoforgeJar
	outputs.file output
	doLast {
		def json = new java.util.zip.ZipFile(neoforgeJar.singleFile).withCloseable { zip ->
			new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('META-INF/injected-interfaces.json')))
		}
		// NeoForge writes generic arguments the Java way (T, java.lang.Object, ResourceKey<?>); class tweakers take JVM
		// signatures. A short class name lives in the target's package, as in NeoForge's patched source.
		def toSignature
		toSignature = { String type, String targetPackage ->
			type = type.trim()
			if (type == '?') return '*'
			if (type ==~ /[A-Z][A-Z0-9_]?/) return "T${type};"
			def args = ''
			int lt = type.indexOf('<')
			if (lt >= 0) {
				def inner = type.substring(lt + 1, type.lastIndexOf('>'))
				def parts = []
				int depth = 0, start = 0
				inner.eachWithIndex { ch, i ->
					if (ch == '<') depth++
					else if (ch == '>') depth--
					else if (ch == ',' && depth == 0) { parts << inner.substring(start, i); start = i + 1 }
				}
				parts << inner.substring(start)
				args = '<' + parts.collect { toSignature(it, targetPackage) }.join('') + '>'
				type = type.substring(0, lt)
			}
			def name = type.replace('.', '/')
			if (!name.contains('/')) name = "${targetPackage}/${name}"
			return "L${name}${args};"
		}
		def lines = ["classTweaker\tv1\tofficial", '',
				"# Generated by the generateTestmodClassTweaker task from NeoForge ${version}'s META-INF/injected-interfaces.json.",
				'# Compile-time only: testmods are NeoForge mods, and this file is never part of their jars.', '']
		json.each { String target, List<String> interfaces ->
			def targetPackage = target.substring(0, target.lastIndexOf('/'))
			interfaces.each { String itf ->
				def signature = toSignature(itf, targetPackage)
				// inject-interface takes the internal name followed by any type arguments, without the L and ;
				lines << "inject-interface\t${target}\t${signature.substring(1, signature.length() - 1)}"
			}
		}
		output.text = lines.join('\n') + '\n'
	}
}

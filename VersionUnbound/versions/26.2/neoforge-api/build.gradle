apply plugin: 'net.fabricmc.fabric-loom'

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// NeoForge's standalone libraries are used as-is and bundled (jar-in-jar).
	api "net.neoforged:bus:${eventbus_version}"
	include "net.neoforged:bus:${eventbus_version}"
	include "net.jodah:typetools:${typetools_version}"
	api "net.neoforged:mergetool:${mergetool_version}:api"
	include "net.neoforged:mergetool:${mergetool_version}:api"
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

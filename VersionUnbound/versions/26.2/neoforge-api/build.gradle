apply plugin: 'net.fabricmc.fabric-loom'

// Client-only code lives in src/client, as in NeoForge, so common code can't reference client classes.
loom {
	splitEnvironmentSourceSets()
	// NeoForge's changes to vanilla's class shapes: un-sealing and extension interfaces (see the file).
	accessWidenerPath = file('src/main/resources/versionunbound_neoforge.classtweaker')

	mods {
		versionunbound_neoforge {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// NeoForge's standalone libraries are used as-is and bundled (jar-in-jar).
	api "net.neoforged:bus:${eventbus_version}"
	include "net.neoforged:bus:${eventbus_version}"
	include "net.jodah:typetools:${typetools_version}"
	api "net.neoforged:mergetool:${mergetool_version}:api"
	include "net.neoforged:mergetool:${mergetool_version}:api"

	// FML's own libraries that Minecraft doesn't ship: mods.toml/config parsing and Maven version ranges.
	api "com.electronwill.night-config:toml:${nightconfig_version}"
	include "com.electronwill.night-config:toml:${nightconfig_version}"
	include "com.electronwill.night-config:core:${nightconfig_version}"
	api "org.apache.maven:maven-artifact:${maven_artifact_version}"
	include "org.apache.maven:maven-artifact:${maven_artifact_version}"
}

processResources {
	def props = [version: project.version, neoforge_version: neoforge_version, neoform_version: neoform_version]
	inputs.properties props
	filesMatching('fabric.mod.json') {
		expand props
	}
}

// NeoForge's access transformers (accesstransformer.cfg and accesstransformergenerated.cfg in its universal jar) as class
// tweaker lines, written into the end of versionunbound_neoforge.classtweaker after the marker line. Mods compiled against
// NeoForge use the members these widen, so they apply to every mod, at compile time (Loom) and at run time (Fabric Loader).
// Loom reads the class tweaker while configuring the project, so the output is checked in; run this task again after
// changing neoforge_version, then generateTestmodClassTweaker (it copies the same lines). Class tweakers need a field's
// descriptor and know no wildcards, so the task reads Minecraft's unmodified jars for them.
configurations {
	neoforgeUniversalAt {
		transitive = false
	}
}
dependencies {
	neoforgeUniversalAt "net.neoforged:neoforge:${neoforge_version}:universal"
}
tasks.register('generateClassTweakerAccess') {
	def neoforgeJar = configurations.neoforgeUniversalAt
	def output = file('src/main/resources/versionunbound_neoforge.classtweaker')
	def version = neoforge_version
	inputs.files neoforgeJar
	doLast {
		def marker = '# --- Generated by generateClassTweakerAccess from NeoForge\'s access transformers. Edit above this line only. ---'
		def mcJars = loom.minecraftProvider.minecraftJars
		// name -> [access, fields: name -> [access, desc], methods: [name, desc, access]]
		def classes = [:]
		mcJars.each { java.nio.file.Path jar ->
			new java.util.zip.ZipFile(jar.toFile()).withCloseable { zip ->
				zip.entries().each { entry ->
					if (!entry.name.endsWith('.class')) return
					def node = new org.objectweb.asm.tree.ClassNode()
					new org.objectweb.asm.ClassReader(zip.getInputStream(entry).bytes).accept(node, org.objectweb.asm.ClassReader.SKIP_CODE)
					classes[node.name] = node
				}
			}
		}
		def atLines = new java.util.zip.ZipFile(neoforgeJar.singleFile).withCloseable { zip ->
			['META-INF/accesstransformer.cfg', 'META-INF/accesstransformergenerated.cfg'].collectMany { name ->
				zip.getInputStream(zip.getEntry(name)).getText('UTF-8').readLines().collect { [name.substring(9), it] }
			}
		}
		def ACC_PRIVATE = org.objectweb.asm.Opcodes.ACC_PRIVATE
		def out = []
		def skipped = []
		atLines.each { file, raw ->
			def line = raw.replaceAll(/#.*/, '').trim()
			if (line.isEmpty()) return
			def parts = line.split(/\s+/)
			def modifier = parts[0]
			def access = modifier.replaceAll(/[-+]f$/, '')
			boolean definal = modifier.endsWith('-f')
			if (modifier.endsWith('+f')) { skipped << "${raw} (adds final)"; return }
			def owner = parts[1].replace('.', '/')
			def node = classes[owner]
			if (node == null) { skipped << "${raw} (no such class)"; return }
			if (parts.length == 2) {
				if (access != 'private') out << "accessible\tclass\t${owner}"
				if (definal) out << "extendable\tclass\t${owner}"
				return
			}
			def member = parts[2]
			def fields = []
			def methods = []
			if (member == '*') {
				fields = node.fields
			} else if (member == '*()') {
				methods = node.methods.findAll { it.name != '<clinit>' }
			} else if (member.contains('(')) {
				def name = member.substring(0, member.indexOf('('))
				def desc = member.substring(member.indexOf('(')).replace('.', '/')
				methods = node.methods.findAll { it.name == name && it.desc == desc }
				if (methods.isEmpty()) { skipped << "${raw} (no such method)"; return }
			} else {
				fields = node.fields.findAll { it.name == member }
				if (fields.isEmpty()) { skipped << "${raw} (no such field)"; return }
			}
			fields.each { f ->
				// Fields have no protected or package level in a class tweaker; accessible (public) covers them.
				if (access != 'private') out << "accessible\tfield\t${owner}\t${f.name}\t${f.desc}"
				if (definal) out << "mutable\tfield\t${owner}\t${f.name}\t${f.desc}"
			}
			methods.each { m ->
				boolean wasPrivate = (m.access & ACC_PRIVATE) != 0
				if (access == 'public') out << "accessible\tmethod\t${owner}\t${m.name}\t${m.desc}"
				// extendable makes a method protected and non-final, and turns the class's own invokespecial calls of a
				// formerly private method into invokevirtual, as NeoForge's AT does. A private method made only
				// accessible would become public final, so mods overriding it (allowed on NeoForge) would fail to load.
				// Interfaces can't have protected methods, and nothing overrides a static method or a constructor.
				boolean isStatic = (m.access & org.objectweb.asm.Opcodes.ACC_STATIC) != 0
				boolean isInterface = (node.access & org.objectweb.asm.Opcodes.ACC_INTERFACE) != 0
				if (isInterface && (access != 'public' || definal)) { skipped << "${raw} (${m.name}: not public in an interface)"; return }
				if (isInterface || (access == 'public' && (isStatic || m.name == '<init>'))) return
				if ((access != 'public' && access != 'private') || definal || wasPrivate) {
					out << "extendable\tmethod\t${owner}\t${m.name}\t${m.desc}"
				}
			}
		}
		def existing = output.text
		int at = existing.indexOf(marker)
		def head = at >= 0 ? existing.substring(0, at) : existing + '\n'
		def lines = [marker, "# NeoForge ${version}. Converted ${atLines.count { it[1].replaceAll(/#.*/, '').trim() }} AT entries to ${out.unique().size()} lines.", '']
		lines.addAll(out.unique())
		output.text = head + lines.join('\n') + '\n'
		if (!skipped.isEmpty()) {
			logger.warn("Skipped ${skipped.size()} AT entries:\n  " + skipped.join('\n  '))
		}
	}
}

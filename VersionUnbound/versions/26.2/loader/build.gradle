apply plugin: 'net.fabricmc.fabric-loom'

loom {
	mods {
		versionunbound {
			sourceSet sourceSets.main
		}
		versionunbound_neoforge {
			sourceSet('main', ':neoforge-api')
			sourceSet('client', ':neoforge-api')
		}
		versionunbound_upgrade_1_21_1 {
			sourceSet('main', ':upgrade-1.21.1')
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	implementation project(':neoforge-api')
	include project(':neoforge-api')
	implementation project(':upgrade-1.21.1')
	include project(':upgrade-1.21.1')
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

// Dev runs load the testmods the way players would: as jars in run/mods.
def copyTestMods = tasks.register('copyTestMods', Copy) {
	from(project(':testmods:hello').tasks.named('jar'))
	from(project(':testmods:metadata').tasks.named('jar'))
	from(project(':testmods:lifecycle').tasks.named('jar'))
	from(project(':testmods:registries').tasks.named('jar'))
	from(project(':testmods:events').tasks.named('jar'))
	from(project(':testmods:hooks').tasks.named('jar'))
	from(project(':testmods:fabricprobe').tasks.named('jar'))
	// Layer B's first real mod: the unmodified Chunky 1.21.1 jar from the corpus, upgraded at launch.
	from(rootProject.file('../../../src/mod_Jars_1-21-1_Neoforge/Chunky/Chunky-NeoForge-1.4.23.jar'))
	into(file('run/mods'))
	doLast {
		file('run/eula.txt').text = 'eula=true\n'
	}
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
	dependsOn copyTestMods
}

pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'versionunbound'

// Layer A: the NeoForge 26.2 API implemented on Fabric 26.2.
include 'neoforge-api'
// Layer B for NeoForge 1.21.1 mods: upgrades their jars to the 26.2 API (rename map, bridges) before FML reads them.
include 'upgrade-1.21.1'
// FML on Fabric: discovers NeoForge jars in mods/ and loads them.
include 'loader'
// Hand-written NeoForge mods that each exercise one API area.
include 'testmods:hello'
include 'testmods:metadata'
include 'testmods:lifecycle'
include 'testmods:registries'
include 'testmods:events'
include 'testmods:hooks'
// A Fabric mod that records when Fabric initializes its mods and what it sees in the registries, for the NeoForge testmods.
include 'testmods:fabricprobe'

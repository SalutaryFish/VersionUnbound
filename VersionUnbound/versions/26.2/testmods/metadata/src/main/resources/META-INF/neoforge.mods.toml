modLoader = "javafml"
# Checked against the version of the built-in javafml loader (FML 11.0.16).
loaderVersion = "[11,)"
license = "LGPL-2.1-only"

[[mods]]
modId = "metadata"
version = "1.2.3"
displayName = "VersionUnbound Metadata"
description = "Checks FML's mod metadata, mod list, loading context, scan data and IMC."

[modproperties.metadata]
answer = 42

[[dependencies.metadata]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,)"

[[dependencies.metadata]]
modId = "neoforge"
type = "required"
versionRange = "[26.2.0,)"

# Loads after hello, so hello is constructed first.
[[dependencies.metadata]]
modId = "hello"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"

[[dependencies.metadata]]
modId = "no_such_mod"
type = "optional"
